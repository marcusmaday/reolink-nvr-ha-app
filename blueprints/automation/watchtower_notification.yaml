blueprint:
  name: Watchtower Event Forwarder
  description: >
    Relay Reolink person, doorbell, animal, and vehicle events from Home
    Assistant into Watchtower. Watchtower-managed notifications should be
    configured inside the app, so this blueprint only forwards events.
  domain: automation
  input:
    doorbell_sensors:
      name: Doorbell sensors
      description: Optional binary sensors that turn on for a doorbell event.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    person_sensor:
      name: Person sensor
      description: Binary sensor that turns on for a person event.
      selector:
        entity:
          domain: binary_sensor
    animal_sensors:
      name: Animal sensors
      description: Optional binary sensors that turn on for an animal event.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    vehicle_sensors:
      name: Vehicle sensors
      description: Optional binary sensors that turn on for a vehicle event.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    camera_name:
      name: Camera name
      description: Friendly name to show in the Watchtower timeline.
      default: Front Door
      selector:
        text: {}
    camera_channel:
      name: Camera channel
      description: >
        Zero-based NVR channel index for this camera. Reolink labels channels
        as 1-12 in the UI, but Watchtower uses indexes 0-11, so this should
        usually be the labeled channel minus 1.
      default: 8
      selector:
        number:
          min: 0
          max: 64
          mode: box

mode: single

triggers:
  - trigger: state
    entity_id: !input doorbell_sensors
    to: "on"
    id: doorbell
  - trigger: state
    entity_id: !input person_sensor
    to: "on"
    id: person
  - trigger: state
    entity_id: !input animal_sensors
    to: "on"
    id: animal
  - trigger: state
    entity_id: !input vehicle_sensors
    to: "on"
    id: vehicle

actions:
  - variables:
      channel: !input camera_channel
      cam_name: !input camera_name
      event_type: >-
        {% if trigger.id == 'doorbell' %}
          DOORBELL
        {% elif trigger.id == 'person' %}
          PERSON
        {% elif trigger.id == 'animal' %}
          ANIMAL
        {% elif trigger.id == 'vehicle' %}
          VEHICLE
        {% else %}
          MOTION
        {% endif %}
      event_timestamp: >-
        {{ trigger.to_state.last_changed.isoformat() if trigger.to_state is not none else now().isoformat() }}
      event_id: "{{ channel }}_{{ event_timestamp }}_{{ event_type }}"
      title: >-
        {% if event_type == 'DOORBELL' %}
          Doorbell
        {% elif event_type == 'PERSON' %}
          Person Detected
        {% elif event_type == 'ANIMAL' %}
          Animal Detected
        {% elif event_type == 'VEHICLE' %}
          Vehicle Detected
        {% else %}
          Motion Detected
        {% endif %}
      message: >-
        {% if event_type == 'DOORBELL' %}
          Someone is at the door.
        {% elif event_type == 'PERSON' %}
          Person detected at {{ cam_name }}.
        {% elif event_type == 'ANIMAL' %}
          Animal detected at {{ cam_name }}.
        {% elif event_type == 'VEHICLE' %}
          Vehicle detected at {{ cam_name }}.
        {% else %}
          Motion detected at {{ cam_name }}.
        {% endif %}
  - action: rest_command.reolink_ingest_event
    data:
      event_id: "{{ event_id }}"
      event_type: "{{ event_type }}"
      channel: "{{ channel }}"
      timestamp: "{{ event_timestamp }}"
      camera_name: "{{ cam_name }}"
      title: "{{ title }}"
      message: "{{ message }}"
      source: "home_assistant"
